# Vehicle and sensor TF owned by T870 MCU.
# REP-103: x forward, y left, z up; metres and radians.
# base_link is the rear axle centre at ground height.

vehicle_geometry:
  # Conflicting 0.58/0.73/0.77 values exist in team repositories and no
  # measured track width is recorded. Set true only after physical remeasurement.
  confirmed: false
  wheelbase_m: null
  track_width_m: null
  diagnostic: "FAIL_VEHICLE_GEOMETRY_UNCONFIRMED"

frames:
  rear_axle:
    enabled: true
    parent: base_link
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
    measurement_status: defined_by_base_link

  camera_link:
    enabled: true
    parent: base_link
    x: 0.32
    y: 0.0
    z: 0.85
    roll: 0.0
    pitch: -0.0872664626
    yaw: 0.0
    measurement_status: remeasure_required

  front_laser:
    enabled: true
    parent: base_link
    x: 0.65
    y: 0.0
    z: 0.20
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
    measurement_status: remeasure_required

  # No measured rear-LiDAR mounting pose is available.
  rear_laser:
    enabled: false
    parent: base_link
    measurement_status: disabled_unmeasured

  # Existing GPS values were estimates, so do not publish until remeasured.
  gps_link:
    enabled: false
    parent: base_link
    measurement_status: disabled_unmeasured

# When vehicle_geometry.confirmed is true, the launch file generates:
#   base_link -> front_axle at x=wheelbase_m
#   rear_axle -> rear_left_wheel/rear_right_wheel at y=+/-track_width_m/2
# Front steering wheel frames are deliberately not static. They require trusted
# /mcu/steer_deg feedback and Ackermann joint-state/dynamic-TF publication.
# RealSense owns optical frames below camera_link.
