# t870_frames.yaml — 센서 장착 위치 (static TF)
#
# ==========================================================
#  ★ 0901 — 전부 실측값으로 교체했다. 이제 🔴 없음.
# ==========================================================
#
#  base_link 원점
#    **네 바퀴 정중앙, 지면 높이**
#    = 앞축 중심과 뒤축 중심의 중점
#    = 바퀴 바깥 기준 100 cm 직사각형의 중심 (두 정의가 같은 점이다)
#
#  좌표 규약 (REP-103)
#    x 앞(+)  y 왼쪽(+)  z 위(+)   단위 m, rad
#    roll = x축, pitch = y축(고개 숙이면 +), yaw = z축(좌회전 +)
#
# ----------------------------------------------------------
#  실측 (0901, SJ)
# ----------------------------------------------------------
#    바퀴 반지름            0.135 m   (지름 0.270)
#    앞바퀴~뒷바퀴 (바퀴 바깥 끝 기준)   1.000 m
#    앞 윤거 0.775 / 뒤 윤거 0.785     (뒤가 1 cm 넓다, 오른쪽이 더 나옴)
#
#  ★ 축거 검산 — 이게 맞아떨어져서 기존 값이 재확인됐다
#      축거 L = 1.000 − 2 × 0.135 = **0.730 m**
#      기존에 쓰던 wheelbase_m: 0.73 과 정확히 일치.
#      (주차팀 코드의 0.77 은 여전히 틀린 값이다. 0.73 으로 고쳐야 한다.)
#
#  ★ 윤거 비대칭
#      앞뒤 1 cm 차이 → 네 바퀴 중심의 y 편향은 2.5 mm.
#      측정 오차보다 작아서 y = 0 으로 둔다.
#
#  ★ 주차팀 URDF 와 교차 검증 (독립 측정인데 거의 같다)
#      front_laser  우리 +0.730  vs 주차팀 +0.7225   차이 0.75 cm
#      rear_laser   우리 −0.680  vs 주차팀 −0.6825   차이 0.25 cm
#
# ----------------------------------------------------------
#  각 값이 어떻게 나왔나 (원점 = 직사각형 중심, 뒤끝 −0.50 / 앞끝 +0.50)
# ----------------------------------------------------------
#    camera_link   뒤끝에서 0.515  →  −0.50 + 0.515 = +0.015
#    front_laser   앞끝에서 앞으로 0.23  →  +0.50 + 0.23 = +0.730
#    rear_laser    뒤끝에서 뒤로 0.18   →  −0.50 − 0.18 = −0.680
#    gps_link      앞끝에서 안으로 0.05 →  +0.50 − 0.05 = +0.450
#    z 는 전부 지면에서 잰 값 그대로 (base_link 가 지면에 있으므로)
#    y 는 전부 0 (모든 센서가 좌우 중앙)
#
#  ⚠ 이 원점은 브릿지의 odom_reference: "center" 와 **한 쌍** 이다.
#    한쪽만 되돌리면 센서가 본 것이 통째로 0.365 m 어긋난다.
#
#  확인
#    ros2 launch t870_mcu t870_frames.launch.py
#    ros2 run tf2_ros tf2_echo base_link front_laser
#    ros2 run tf2_tools view_frames

frames:
  # ---- 라이다 (RPLIDAR A2M12 ×2) ----
  #  이름은 라이다팀 규약(front_laser / rear_laser)을 따른다.
  #  avoidance_sim rplidar.yaml 의 frame_id 도 front_laser 다.
  front_laser:
    parent: base_link
    x: 0.730         # 실측: 앞바퀴 바깥에서 앞으로 0.23
    y: 0.000
    z: 0.105         # 실측: 지면에서 10.5 cm
    roll: 0.0
    pitch: 0.0
    yaw: 0.0         # ⚠ 라이다 0도 표시가 차 정면이 아니면 그 각을 넣을 것

  rear_laser:
    parent: base_link
    x: -0.680        # 실측: 뒷바퀴 바깥에서 뒤로 0.18
    y: 0.000
    z: 0.155         # 실측: 지면에서 15.5 cm
    roll: 0.0
    pitch: 0.0
    yaw: 3.14159265  # ⚠ 뒤를 보게 달았다고 가정(180도). 앞을 보면 0.0 으로 고칠 것

  #  구버전 이름 호환 — 전방 라이다와 완전히 같은 위치.
  #  일부 실행 스크립트가 아직 frame_id=laser 로 뜬다. 그것들이 정리되면 지운다.
  laser:
    parent: base_link
    x: 0.730
    y: 0.000
    z: 0.105
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

  # ---- 카메라 (RealSense D456) ----
  camera_link:
    parent: base_link
    x: 0.015         # 실측: 뒤끝에서 51.5 cm → 정중앙보다 1.5 cm 앞
    y: 0.000
    z: 0.970         # 실측: 지면에서 97 cm
    roll: 0.0
    pitch: 0.0872665 # 아래로 5도 (REP-103 은 숙임이 +)
    yaw: 0.0

  #  D456 내장 IMU. 데이터시트 오프셋은 아직 미확인이라 0 으로 둔다.
  #  카메라 자체 위치가 맞으므로 자세(roll/pitch/yaw) 용도로는 문제없다.
  imu_link:
    parent: camera_link
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

  # ---- GPS 안테나 (u-blox) ----
  gps_link:
    parent: base_link
    x: 0.450         # 실측: 앞끝에서 안으로 5 cm
    y: 0.000
    z: 0.430         # 실측: 지면에서 43 cm
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
